name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          # No extra system deps usually needed for Windows Tauri build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node_version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ContextXode ${{ github.ref_name }}'
          releaseBody: 'Automated release for ContextXode.'
          releaseDraft: false
          prerelease: false